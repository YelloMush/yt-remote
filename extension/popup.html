<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; margin: 0; padding: 14px; width: 230px; background: #111; color: #eee; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #777; }
    .dot.on { background: #3ecf6e; }
    .dot.off { background: #e5484d; }
    p { color: #aaa; margin: 10px 0 0; line-height: 1.4; }
    code { color: #ddd; }
  </style>
</head>
<body>
  <h1>YT Remote</h1>
  <div class="row"><span id="dot" class="dot"></span><span id="label">Checking…</span></div>
  <p id="hint"></p>
  <script src="popup.js"></script>
</body>
</html>
